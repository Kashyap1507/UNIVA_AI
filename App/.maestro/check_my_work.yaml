appId: com.kashyap.wizlyai.android
---
# Test: Check my work (scan a page of your work and get hint-first feedback)
# Needs a signed-in student with at least one course, camera permission granted,
# and the server running with a Gemini key (feedback is generated by the AI).

- launchApp

- assertVisible:
    text: "Today"
    timeout: 15000

# + → Check my work opens the camera
- tapOn: "Create"
- tapOn: "Check my work"

# Capture a page, then accept the crop
- tapOn:
    text: "Capture photo.*"
    regex: true
- tapOn:
    text: "Accept"
    timeout: 10000

# Review the pages
- assertVisible: "How does this look?"
- takeScreenshot: "03-scan-review"
- tapOn: "Check my work"

# Pick the course and send (hint-first unless "This is practice" is on)
- assertVisible: "Course"
- assertVisible: "This is practice"
- tapOn:
    text: "Check my work"
    index: 1

- assertVisible:
    text: "Checking your work"
    timeout: 10000

# Feedback per problem
- assertVisible:
    text: "Problem .*"
    regex: true
    timeout: 120000
- takeScreenshot: "03-work-feedback"
- tapOn: "Done"
