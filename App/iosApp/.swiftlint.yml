# SwiftLint Configuration for Wizly iOS App

# Paths to exclude from linting
excluded:
  - Pods
  - .build
  - DerivedData
  - Carthage
  - vendor
  - "**/*.generated.swift"

# Paths to include (optional, helps performance)
included:
  - iosApp

# Disable some rules that conflict with common Swift/iOS conventions
disabled_rules:
  - trailing_whitespace  # Allow trailing whitespace (auto-handled by Xcode)
  - cyclomatic_complexity # Allow complex logic in some cases
  - force_cast           # Sometimes necessary for iOS APIs
  - force_try            # Sometimes necessary for known-safe operations
  - todo                 # Allow TODO comments for tracking work
  - type_name            # Allow flexible type names (e.g., iOSApp)
  - control_statement    # Allow parentheses in control statements

# Opt-in rules to enable (not enabled by default)
opt_in_rules:
  - empty_count          # Prefer isEmpty over count == 0
  - contains_over_first_not_nil # Prefer contains over first(where:) != nil
  - empty_string         # Prefer isEmpty over == ""
  - fatal_error_message  # Require messages for fatalError
  - first_where          # Prefer first(where:) over filter + first
  - flatmap_over_map_reduce # Prefer flatMap over map + reduce
  - last_where           # Prefer last(where:) over filter + last

# Configure specific rule thresholds

# Identifier naming (lenient for common patterns)
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - i
    - j
    - k

# Line length (lenient for readability)
line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

# Function body length (lenient for UI code)
function_body_length:
  warning: 100
  error: 150

# Function parameter count (lenient for bridge functions)
function_parameter_count:
  warning: 8
  error: 12

# File length (lenient for feature files)
file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

# Nesting depth
nesting:
  type_level:
    warning: 3

# Reporter type (use "xcode" for integration, "emoji" for fun output)
reporter: "xcode"

# Analyze severity levels
analyzer_rules:
  - unused_declaration
  - unused_import
